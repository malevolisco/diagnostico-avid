name: Construir y probar DiagnosticoAvid

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install --only-binary ":all:" pyavb openpyxl pillow pyinstaller

      - name: ffmpeg 7.1.1 (build fijada de gyan.dev)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip" -OutFile ffmpeg.zip
          $h = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($h -ne "04861D3339C5EBE38B56C19A15CF2C0CC97F5DE4FA8910E4D47E5E6404E4A2D4") { throw "ffmpeg.zip no coincide con la versión fijada: $h" }
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem ffx -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination bin
          Remove-Item bin/PONER_AQUI_ffmpeg.txt -ErrorAction SilentlyContinue
          & bin/ffmpeg.exe -version | Select-Object -First 1

      - name: Pruebas unitarias (con el ffmpeg fijado en el PATH)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;" + $env:PATH
          python -m unittest discover -s tests -v

      - name: Número de build
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $fecha = Get-Date -Format "yyyy-MM-dd"
          Set-Content -Path build.txt -Value "build-${{ github.run_number }} $sha $fecha" -Encoding utf8NoBOM
          Get-Content build.txt

      - name: Construir ejecutable
        run: pyinstaller --noconfirm --clean --noconsole --onedir --name DiagnosticoAvid --add-data "bin;bin" --add-data "build.txt;." --hidden-import interfaz --hidden-import tema --hidden-import ventana_montaje --hidden-import ventana_origen --hidden-import aprendizaje --hidden-import montaje --hidden-import mxf_util diagnostico_avid.py

      - name: Disco de prueba simulado
        run: python tests/crear_disco_prueba.py disco_prueba --ffmpeg bin/ffmpeg.exe --ffprobe bin/ffprobe.exe

      - name: Probar el .exe (análisis + brutos) en Windows
        shell: pwsh
        run: |
          # El disco simulado tiene material capturado sin nombre de cámara (como el de México): estas pruebas lo meten en
          # los brutos, como hasta el 27/10/2026. La regla nueva (solo lo de cámara) se prueba aparte, al final.
          '{"solo_material_de_camara": false}' | Set-Content dist/DiagnosticoAvid/config_brutos.json -Encoding utf8NoBOM
          '{"solo_material_de_camara": false}' | Set-Content config_brutos.json -Encoding utf8NoBOM
          $p = Start-Process -FilePath "dist/DiagnosticoAvid/DiagnosticoAvid.exe" -ArgumentList "--origen disco_prueba --destino salida --brutos brutos --sin-gui --no-abrir --media-extra disco_prueba_media2" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content salida/*/diagnostico.log; throw "El ejecutable ha fallado con código $($p.ExitCode)" }
          Get-Content salida/*/diagnostico.log | Select-Object -Last 15

      - name: Comprobar resultado
        run: python tests/comprobar_resultado.py salida brutos --ffprobe bin/ffprobe.exe

      - name: Segunda ejecución sobre los mismos brutos (debe reanudar, no repetir)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/DiagnosticoAvid/DiagnosticoAvid.exe" -ArgumentList "--origen disco_prueba --destino salida2 --brutos brutos --sin-gui --no-abrir --zip-sin-miniaturas --media-extra disco_prueba_media2" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content salida2/*/diagnostico.log; throw "El ejecutable ha fallado con código $($p.ExitCode)" }
          python tests/comprobar_resultado.py salida2 brutos --ffprobe bin/ffprobe.exe --reanudado

      - name: Análisis y brutos solo de algunos proyectos (selector)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/DiagnosticoAvid/DiagnosticoAvid.exe" -ArgumentList '--origen disco_prueba --destino salida4 --brutos brutos_sel --sin-gui --no-abrir --sin-miniaturas --proyectos "NTSC;ABORTO"' -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content salida4/*/diagnostico.log; throw "El ejecutable ha fallado con código $($p.ExitCode)" }
          python -c "import json; r = json.load(open('brutos_sel/brutos_resultado.json', encoding='utf-8')); n = sorted(b['proyecto'] for b in r); print(n); assert n == ['ABORTO SEPTIEMBRE DE 2021', 'NTSC SEPTIEMBRE DE 2021'], n"
          python -c "import json, glob; r = json.load(open(glob.glob('salida4/Diagnostico_*/resumen.json')[0], encoding='utf-8'))['parcial']; print(r); assert r['proyectos'] == ['ABORTO', 'NTSC'] and r['mxf_analizados'] < r['mxf_disco'], r"

      - name: Repetir un análisis no vuelve a leer los MXF (caché)
        shell: pwsh
        run: |
          Start-Sleep -Seconds 61  # otro minuto: otra carpeta Diagnostico_ y otro log
          $p = Start-Process -FilePath "dist/DiagnosticoAvid/DiagnosticoAvid.exe" -ArgumentList '--origen disco_prueba --destino salida4 --sin-gui --no-abrir --sin-miniaturas --proyectos "NTSC;ABORTO"' -PassThru -Wait -NoNewWindow
          $log = Get-ChildItem salida4/Diagnostico_*/diagnostico.log | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "El ejecutable ha fallado con código $($p.ExitCode)" }
          $linea = Select-String -Path $log -Pattern "Cache de analisis .*: ([1-9]\d*) de \d+ ya leidos; se leen 0"
          if (-not $linea) { Get-Content $log; throw "La segunda vez ha vuelto a leer MXF: no ha usado la caché" }
          $linea.Line
          Get-ChildItem salida4/cache_analisis

      - name: Analizar otro proyecto suma los ya analizados (no se repiten)
        shell: pwsh
        run: |
          Start-Sleep -Seconds 61  # otro minuto: otra carpeta Diagnostico_
          $p = Start-Process -FilePath "dist/DiagnosticoAvid/DiagnosticoAvid.exe" -ArgumentList '--origen disco_prueba --destino salida4 --sin-gui --no-abrir --sin-miniaturas --proyectos "APROX"' -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "El ejecutable ha fallado con código $($p.ExitCode)" }
          python -c "import json, glob, os; d = max(glob.glob('salida4/Diagnostico_*/'), key=os.path.getmtime); r = json.load(open(d + 'resumen.json', encoding='utf-8'))['parcial']; print(r['proyectos'], sorted(r['de_antes'])); assert r['proyectos'] == ['ABORTO', 'APROX', 'NTSC'] and sorted(r['de_antes']) == ['ABORTO', 'NTSC'] and not r['cambiados'], r"

      - name: Exportar con un análisis ya hecho y un montaje hecho a mano (cortar, reordenar, renombrar, quitar)
        shell: pwsh
        run: |
          $a = (Get-ChildItem -Directory salida/Diagnostico_* | Select-Object -First 1).FullName
          python tests/probar_montaje.py preparar "$a" brutos_montaje
          $p = Start-Process -FilePath "dist/DiagnosticoAvid/DiagnosticoAvid.exe" -ArgumentList "--usar-analisis `"$a`" --brutos brutos_montaje --proyectos `"15 SEPT CENTROAMERICA;ABORTO`"" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content brutos_montaje/exportacion.log; throw "El ejecutable ha fallado con código $($p.ExitCode)" }
          python tests/probar_montaje.py comprobar brutos_montaje

      - name: Ventana de tres páginas de principio a fin (analizar, montar, exportar), con capturas
        shell: pwsh
        run: |
          # pantalla más grande que la ventana (1280x800) para que las capturas salgan enteras; si no se puede, se sigue
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "No se puede cambiar la resolución: $_" }
          python tests/probar_interfaz.py disco_prueba salida_ventana brutos_ventana capturas_ventana

      - name: Guardar capturas de la ventana
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas_ventana
          path: capturas_ventana
          if-no-files-found: ignore

      - name: Exportación con agrupar=proyecto y formato auto (por tarjetas, copia, timecode NTSC drop-frame)
        shell: pwsh
        run: |
          Set-Content dist/DiagnosticoAvid/config_brutos.json '{"agrupar": "proyecto", "formato_salida": "auto", "excluir_importados": false, "solo_material_de_camara": false}' -Encoding utf8NoBOM
          $p = Start-Process -FilePath "dist/DiagnosticoAvid/DiagnosticoAvid.exe" -ArgumentList "--origen disco_prueba --destino salida3 --brutos brutos_proyecto --sin-gui --no-abrir --media-extra disco_prueba_media2" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content salida3/*/diagnostico.log; throw "El ejecutable ha fallado con código $($p.ExitCode)" }
          Remove-Item dist/DiagnosticoAvid/config_brutos.json
          python tests/comprobar_resultado.py salida3 brutos_proyecto --ffprobe bin/ffprobe.exe --agrupar proyecto

      - name: Por defecto, en los brutos solo entra lo que tiene pistas de cámara (Adrián, 27/10/2026)
        shell: pwsh
        run: |
          # Sin config: valores por defecto. Lo capturado sin nombre de cámara (15 SEPT, ABORTO, APROX, huérfanos) se queda fuera;
          # entran las tarjetas (NTSC, la XDROOT de China), el dron y la A7, la Panasonic por sus metadatos y lo enlazado de tarjeta
          if (Test-Path dist/DiagnosticoAvid/config_brutos.json) { Remove-Item dist/DiagnosticoAvid/config_brutos.json }
          $p = Start-Process -FilePath "dist/DiagnosticoAvid/DiagnosticoAvid.exe" -ArgumentList "--origen disco_prueba --destino salida5 --brutos brutos_camara --sin-gui --no-abrir --sin-miniaturas --media-extra disco_prueba_media2" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content salida5/*/diagnostico.log; throw "El ejecutable ha fallado con código $($p.ExitCode)" }
          # Sin caracteres chinos en la orden ni en la consola (cp1252): el bruto de China se reconoce por el principio del nombre
          python -c "import json; r = {b['proyecto']: b['incluidos'] for b in json.load(open('brutos_camara/brutos_resultado.json', encoding='utf-8'))}; print(ascii(r)); n = {k.split(' ')[0] if k.startswith('20260916_CHINA') else k: v for k, v in r.items()}; assert n == {'20260916_CHINA': 3, 'ENLACES SEPTIEMBRE DE 2021': 2, 'NTSC SEPTIEMBRE DE 2021': 2, 'ORIGEN SEPTIEMBRE DE 2021': 1}, ascii(r)"
          # Qué proyectos restaurar (28/10/2026): con --sin-miniaturas, igualmente una captura por clip de cámara o dudoso (8 + 14 en el
          # disco de prueba); ABORTO solo tiene vídeos sin pistas de cámara: "revisar", no "sin material"
          python -c "import json, glob; d = glob.glob('salida5/Diagnostico_*/')[0]; t = {x['proyecto']: x['veredicto'] for x in json.load(open(d + 'triaje.json', encoding='utf-8'))}; print(ascii(t)); n = len(glob.glob(d + 'miniaturas/*.jpg')); print(n, 'capturas'); assert t['NTSC'] == 'poco' and t['ABORTO'] == 'revisar' and [v for k, v in t.items() if k.startswith('20260916')] == ['restaurar'] and n == 22, ascii(t)"
          Remove-Item dist/DiagnosticoAvid/config_brutos.json

      - name: Autoactualización (release falsa en local; el .bat cambia la carpeta)
        shell: pwsh
        run: |
          # "Instalado": una copia del .exe con una configuración propia que debe conservarse, en una
          # carpeta con espacios, paréntesis y ñ (como "DiagnosticoAvid (2)" al descomprimir dos veces)
          New-Item -ItemType Directory -Force prueba_act, falsa | Out-Null
          $app = "prueba_act/Diagnostico Avid (2) ñ"
          Copy-Item -Recurse dist/DiagnosticoAvid $app
          Set-Content "$app/config_brutos.json" '{"prefijo_fichero": "MIO_"}' -Encoding utf8NoBOM
          # "Release nueva": el mismo programa con otro número de build
          Copy-Item -Recurse dist/DiagnosticoAvid falsa/
          Remove-Item falsa/DiagnosticoAvid/config_*.json -ErrorAction SilentlyContinue
          Set-Content falsa/DiagnosticoAvid/_internal/build.txt "build-99999 prueba 2026-01-01" -Encoding utf8NoBOM
          Compress-Archive -Path falsa/DiagnosticoAvid -DestinationPath falsa/DiagnosticoAvid_portable.zip
          $zip = Get-Item falsa/DiagnosticoAvid_portable.zip
          @{ tag_name = "build-99999"; assets = @(@{ name = "DiagnosticoAvid_portable.zip"; browser_download_url = ([System.Uri]$zip.FullName).AbsoluteUri; size = $zip.Length }) } | ConvertTo-Json -Depth 4 | Set-Content falsa/latest.json -Encoding utf8NoBOM
          $env:DIAGNOSTICO_URL_ACTUALIZACION = ([System.Uri](Resolve-Path falsa/latest.json).Path).AbsoluteUri
          $log = "$env:LOCALAPPDATA/DiagnosticoAvid/actualizacion.log"
          $p = Start-Process -FilePath "$app/DiagnosticoAvid.exe" -ArgumentList "--actualizar-ahora" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "--actualizar-ahora ha fallado ($($p.ExitCode))" }
          # el .bat espera a que se cierre el programa y cambia la carpeta
          for ($i = 0; $i -lt 90; $i++) { if (-not (Test-Path "${app}_actualizacion")) { break }; Start-Sleep 1 }
          Get-Content $log
          if (-not ((Get-Content "$app/_internal/build.txt") -match "build-99999")) { throw "no se ha cambiado de versión" }
          if (-not ((Get-Content "$app/config_brutos.json" -Raw) -match "MIO_")) { throw "se ha perdido la configuración" }
          if (Test-Path "${app}_anterior") { throw "queda la carpeta de la versión anterior" }
          if (Test-Path "${app}_actualizacion") { throw "queda la carpeta de trabajo" }
          # el programa nuevo arranca y ya está al día
          $p = Start-Process -FilePath "$app/DiagnosticoAvid.exe" -ArgumentList "--actualizar-ahora" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "el programa actualizado no arranca ($($p.ExitCode))" }
          Get-Content $log -Tail 3

      - name: Empaquetar portable
        shell: pwsh
        run: |
          Remove-Item dist/DiagnosticoAvid/config_*.json -ErrorAction SilentlyContinue  # los crea la prueba; no van en el portable
          Copy-Item INSTRUCCIONES.txt dist/DiagnosticoAvid/
          Compress-Archive -Path dist/DiagnosticoAvid -DestinationPath DiagnosticoAvid_portable.zip -CompressionLevel Optimal
          Compress-Archive -Path salida/* -DestinationPath informe_prueba.zip -CompressionLevel Optimal

      - name: Guardar informe de la prueba
        uses: actions/upload-artifact@v4
        with:
          name: informe_prueba
          path: informe_prueba.zip

      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DiagnosticoAvid build ${{ github.run_number }}
          body: |
            Portable para Windows: descomprimir y hacer doble clic en `DiagnosticoAvid.exe`.
            Construido y probado automáticamente a partir de `${{ github.sha }}`.
          files: DiagnosticoAvid_portable.zip
